<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | ShopEase</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><a class="auth-back" href="/">← Back to ShopEase</a><main class="auth-shell"><div class="auth-art register-art"><div class="auth-art-content"><span class="brand-mark big-mark">S</span><h1>A little joy<br>starts <em>here.</em></h1><p>Create your account and make room for lovely finds.</p><div class="auth-art-spark">✿</div></div></div><section class="auth-panel"><a class="brand auth-brand" href="/"><span class="brand-mark">S</span> shop<span>ease.</span></a><div class="auth-form-wrap"><span class="eyebrow">JOIN THE HAPPY PLACE</span><h2>Create your account</h2><p class="muted">It only takes a minute.</p><form id="register-form"><label>Full name<input type="text" id="name" placeholder="Your name" required minlength="2" autocomplete="name"></label><label>Email address<input type="email" id="email" placeholder="you@example.com" required autocomplete="email"></label><label>Password<input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password"></label><button class="btn btn-primary btn-full" type="submit">Create account <span>→</span></button><p id="form-message" class="form-message"></p></form><p class="auth-switch">Already have an account? <a href="login.html">Log in</a></p></div></section></main><div id="toast" class="toast"></div><script src="auth.js"></script></body></html>
