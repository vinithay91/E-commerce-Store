<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Log in | ShopEase</title><link rel="stylesheet" href="style.css"></head>
<body class="auth-page"><a class="auth-back" href="/">← Back to ShopEase</a><main class="auth-shell"><div class="auth-art"><div class="auth-art-content"><span class="brand-mark big-mark">S</span><h1>Good to<br>see you <em>again.</em></h1><p>Your favorite finds are just a few clicks away.</p><div class="auth-art-spark">✳</div></div></div><section class="auth-panel"><a class="brand auth-brand" href="/"><span class="brand-mark">S</span> shop<span>ease.</span></a><div class="auth-form-wrap"><span class="eyebrow">WELCOME BACK</span><h2>Log in to your account</h2><p class="muted">Pick up right where you left off.</p><form id="login-form"><label>Email address<input type="email" id="email" placeholder="you@example.com" required autocomplete="email"></label><label>Password<input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password"></label><button class="btn btn-primary btn-full" type="submit">Log in <span>→</span></button><p id="form-message" class="form-message"></p></form><p class="auth-switch">New around here? <a href="register.html">Create an account</a></p></div></section></main><div id="toast" class="toast"></div><script src="auth.js"></script></body></html>
